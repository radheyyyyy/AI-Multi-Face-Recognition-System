<!DOCTYPE html>
<html>

<head>
    <title>Register Face</title>

    <style>

        body{
            text-align:center;
            font-family:Arial;
            background:#f5f5f5;
        }

        h1{
            margin-top:20px;
        }

        video{
            border:3px solid black;
            border-radius:12px;
        }

        button{
            padding:12px 20px;
            font-size:18px;
            cursor:pointer;
            border:none;
            border-radius:8px;
            margin-top:10px;
        }

        input{
            padding:10px;
            width:300px;
            font-size:18px;
        }

        #preview{
            margin-top:20px;
            width:250px;
            border-radius:10px;
        }

    </style>

</head>

<body>

    <h1>Register User</h1>

    <input type="text"
        id="username"
        placeholder="Enter Full Name">

    <br><br>

    <video id="video"
        width="650"
        autoplay
        style="transform: scaleX(-1);">
    </video>

    <br><br>

    <button onclick="capture()">
        Capture Face
    </button>

    <br><br>

    <h2>OR Upload Image</h2>

    <input type="file"
        id="fileInput"
        accept="image/*">

    <br><br>

    <button onclick="uploadImage()">
        Upload Face
    </button>

    <br><br>

    <img id="preview">

    <canvas id="canvas"
        width="650"
        height="450"
        style="display:none;">
    </canvas>

    <script>

        const video = document.getElementById('video');

        navigator.mediaDevices.getUserMedia({
            video:true
        })

        .then((stream)=>{
            video.srcObject = stream;
        });


        function capture(){

            const name =
                document.getElementById('username').value;

            if(name === ""){
                alert("Enter Name");
                return;
            }

            const canvas =
                document.getElementById('canvas');

            const context =
                canvas.getContext('2d');

            context.setTransform(1,0,0,1,0,0);

            context.translate(canvas.width,0);

            context.scale(-1,1);

            context.drawImage(video,0,0,650,450);

            const image =
                canvas.toDataURL('image/png');

            saveFace(image,name);
        }


        function uploadImage(){

            const fileInput =
                document.getElementById('fileInput');

            const file = fileInput.files[0];

            const name =
                document.getElementById('username').value;

            if(name === ""){
                alert("Enter Name");
                return;
            }

            if(!file){
                alert("Choose Image");
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e){

                document.getElementById('preview').src =
                    e.target.result;

                saveFace(e.target.result,name);
            }

            reader.readAsDataURL(file);
        }


        function saveFace(image,name){

            fetch('/save_face',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    image:image,
                    name:name
                })

            })

            .then(response => response.json())

            .then(data => {

                alert(data.message);

            })

            .catch(error => {

                console.log(error);

            });

        }

    </script>

</body>

</html>
